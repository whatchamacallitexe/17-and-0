name: Patch static image URLs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-static-images.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Rewrite Next image optimizer URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const re = /src:"\/[^"]*_next\/image\?url="\.concat\(encodeURIComponent\((\w+)\)\)\+"&w="\.concat\(\d+,"&q="\)\.concat\(\d+\)/g;
          let changed = 0;
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.js')) {
                const src = fs.readFileSync(full, 'utf8');
                if (!src.includes('_next/image?url=')) continue;
                const out = src.replace(re, 'src:$1');
                if (out !== src) {
                  fs.writeFileSync(full, out);
                  changed++;
                  console.log('patched', full);
                }
              }
            }
          };
          walk('_next/static/chunks');
          console.log('files patched:', changed);
          NODE

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _next/static/chunks
          if git diff --cached --quiet; then
            echo "already patched"
            exit 0
          fi
          git commit -m "Serve team logos directly instead of through the Next image optimizer"
          git push
