name: Mirror 17-0 results route

# The draft ends by opening /build-a-17-0-team/results, which has to exist in this copy too.
# Re-run this after the upstream game changes; paths are limited so the bot commit does not loop.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mirror-results.cjs
      - .github/workflows/mirror-17-results.yml

permissions:
  contents: write

concurrency:
  group: mirror-17-results
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the results route
        run: node scripts/mirror-results.cjs
      - name: Commit any mirrored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to mirror"
            exit 0
          fi
          git commit -m "Mirror the 17-0 results route"
          git push
